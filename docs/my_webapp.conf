#rewrite ^/$ /index.php permanent;

#gestion du mode maintenance
if (-f /var/www/my_webapp/www/.maintenance) {
	return 503;
}

#page d'erreur
error_page 503 = @maintenance;

#ressources statiques
location ~* \.(?:css|jpg|png|svg)$ {
	root /var/www/my_webapp/www;
	try_files $uri =404;
	error_page 404 = /index.html;
}
location = /security.txt {
	default_type text/plain;
	alias /var/www/my_webapp/www/security.txt;
}
location = /www/.well-known/security.txt {
	default_type text/plain;
	alias /var/www/my_webapp/.well-known/security.txt;
}
location = /www/.well-known/pgp-key.txt {
	default_type text/plain;
	alias /var/www/my_webapp/.well-known/pgp-key.txt;
}

location / {

    #Header de protection 
    add_header X-Frame-Options           "SAMEORIGIN"                      always;
    add_header X-Content-Type-Options    "nosniff"                         always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy   "default-src 'self' https://*.helloasso.com 'unsafe-inline' data:; style-src-elem 'self' https://*.helloasso.com; script-src 'self' 'unsafe-inline' https://*.helloasso.com; frame-src 'self' https://*.helloasso.com; media-src 'self' https://*.helloasso.com; object-src 'none'" always;

    # Path to source
    alias /var/www/my_webapp/www/;

    # Default indexes and catch-all
    index index.php;
    #try_files $uri $uri/ index.php?$args =404;
    try_files $uri $uri/ @site_php;

    # Prevent useless logs
    location = /favicon.ico {
        log_not_found off;
        access_log off;
    }

    location = /robots.txt {
        allow all;
        log_not_found off;
        access_log off;
    }

    # Deny access to hidden files and directories
    location ~ ^/(.+/|)\.(?!well-known\/) {
        deny all;
    }

    include conf.d/lesmegeresdelhumus.fr.d/my_webapp.d/*.conf;

    # Include SSOWAT user panel.
    include conf.d/yunohost_panel.conf.inc;
}
location @site_php{
	fastcgi_pass unix:/var/run/php/php8.4-fpm-my_webapp.sock;
	include fastcgi_params;
	fastcgi_param SCRIPT_FILENAME /var/www/my_webapp/www/index.php;
	fastcgi_param PATH_INFO       $request_uri;
	fastcgi_param SITE_BASE_PATH  /;
	fastcgi_param SITE_BASE_URL   https://lesmegeresdelhumus.fr;
}
location @maintenance {
	root /var/www/my_webapp/www/maintenance;
	try_files /index.html =503;
	internal;
}
