# Deployment defaults for Grav
SSH_HOST="192.168.0.51"
SSH_PORT="1000"
SSH_USER="root"
SSH_KEY_PATH="/home/pilipe/.ssh/id_ed25519_deploy"
SSH_CONTROL_MASTER="0"
REMOTE_BASE="/var/www/grav"
BASE_URL="https://grav.lesmegeresdelhumus.fr/grav"
REMOTE_OWNER_GROUP="grav:www-data"
# Directories use 2750 so new subdirectories inherit the web group via the setgid bit.
REMOTE_DIR_MODE="2750"
REMOTE_FILE_MODE="640"
BACKUP_ENABLED="1"
BACKUP_PATH="/var/www/grav.backup"
BACKUP_TIMESTAMPED="1"
RUN_CHECKS="1"
RUN_POST_DEPLOY_CHECK="1"

declare -a DEPLOY_INCLUDE_PATHS=(
  "user"
)
