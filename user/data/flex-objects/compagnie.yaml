e68b86496e1e76f4b74f55ccd9cb47b3:
  title: 'La Compagnie'
  details:
    citation_texte: 'Il est essentiel de prendre le temps de prendre le temps.'
    citation_auteur: "La Compagnie Les Mégères de l'Humus"
    citation_2_texte: 'Et oui, car nous sommes Les Mégères de l’Humus ; nous papotons et nous œuvrons pour un monde chaque jour un peu plus doux et juste.'
    citation_2_auteur: 'Delphine, Marie, Sabine & Suzie'
    texte_debut: "La compagnie a été créée pour deux raisons essentielles : travailler à notre rythme et faire nos propres créations. En effet, nous ne nous sommes jamais identifiées à la dynamique de cette société capitaliste et patriarcale qui valorise la productivité, la richesse et la domination. \n\nPour protéger notre santé mentale et physique nous avons décidé de nous extraire de ces schémas en valorisant plutôt la créativité, le soin et la lenteur. Faire du spectacle vivant est notre manière à nous de militer dans la joie et la bonne humeur. Sur scène, nous voulons parler des sujets qui nous tiennent à cœur en toute liberté. Et ce qui nous tient à cœur c’est de dénoncer et lutter contre toutes les oppressions systémiques."
    texte_fin: "Rien que ça ! Alors nous nous nourrissons intellectuellement, politiquement, socialement, humainement pour transmettre tout ce que nous apprenons aux petit·e·s et aux plus grand·e·s. Nous nous éduquons avec l’aide de notre public et nous réinventons des espaces dédiés aux relations intergénérationnelles. Enfin, nous osons construire le monde professionnel et artistique bienveillant dont nous rêvions depuis toujours. Alliant fantaisie et poésie, humour et sensibilité, Les Mégères de l'Humus cultivent un univers politisé, touchant et merveilleux.\n\nNous faisons partie intégrante de la nature et nous l’oublions si vite, toustes accaparé·e·s par nos rythmes effrénés. Mais ne vous inquiétez pas car nous sommes là pour vous faire ralentir la cadence, vous apporter réconfort, joie et de quoi vous remplumer pour vos futures luttes."
  intro:
    texte_principal: "*Les Mégères de l’Humus* est une compagnie de théâtre éco-queer, féministe et artiviste. Elle voit le jour en 2022 sur le territoire audois grâce à la rencontre fortuite de Sabine, Suzie, Delphine et Marie. Toutes les quatre sont en constante réflexion, elles observent et questionnent le rapport qu’elles ont au monde.\n\nSabine et Suzie sont comédiennes et sont à l’origine du projet _Les Mégères de l’Humus_. Elles pratiquent un théâtre de l’intime et proposent aux spectateur·ice·s un voyage qui l'implique dans l'acte théâtral. C'est autour d'une envie forte d'ancrage, d’échange, d’indépendance et de beauté, qu'elles se sont retrouvées.\n\nDelphine et Marie, elles, sont deux amoureuses de la culture et ont décidé de soutenir Sabine et Suzie en créant la structure d'accueil adaptée, l’association loi 1901 *Les Mégères de l'Humus*."
