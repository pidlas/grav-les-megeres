    gorgone_texte: "D’après le dictionnaire Le Robert, une mégère est “une femme méchante et criarde”. Dans le langage familier, les mégères sont des femmes qui discutent entre elles et qui alimentent les potins de leur quartier. Nous appelons aussi ces femmes des commères ou des rombières. Ces jolis noms d’oiseaux sont peu avantageux et ont une connotation péjorative. Par curiosité, nous avons cherché s’il existait des adjectifs similaires pour parler des hommes qui discutent entre eux. Et bien figurez-vous qu’il n’en existe pas ! Compère signifie camarade, rombier est un synonyme de soldat et le mot mégère n’a pas son ascendant masculin ! Et oui, il ne faut pas oublier que nous vivons dans un monde où le patriarcat règne en maître et où les afab, \"assigned female at birth\", \"femme assignée à leur genre par la naissance\", sont soumises à des jugements dévalorisants juste parce qu’elles sont nées et reconnues comme femmes. Et cela les poursuit jusque dans le dictionnaire. Alors nous avons décidé de remettre au goût du jour ses mots si indélicats, se les réapproprier et être fières d'être de terribles Mégères ! Car ces avec les mots que l'on pense le monde. Et alors pourquoi ne pas avoir choisi de s'appeler les Commères de l'Humus ou les Rombières de l'Humus ? "
    erinyes_texte: "Lorsque nous étions à la recherche d’une figure symbolique de femmes puissantes nous sommes revenues à notre amour premier du théâtre autour des histoires et de la mythologie. C'était important pour nous de toujours faire appel à nos racines. Nous avons alors redécouvert avec plaisir le mythe des Érinyes. Et oui ! La mégère en est une référence directe. Les Érinyes sont de très anciennes déesses persécutrices et nous en connaissons trois. Il y a Tisiphone - la vengeance, Alecto - l’implacable et Mégère - la haine. Elles représentaient les lois de l’ordre moral, les faisaient respecter et châtiaient les humain·e·s qui les transgressaient. Les Érinyes étaient redoutables, intransigeantes et cruelles. Rien ne pouvait les écarter de leur mission et elles avaient tous les droits. Craintes des divinités et des humain·e·s, elles étaient marginalisées et vivaient dans l’Érèbe, les ténèbres des Enfers. Les Érinyes sont des êtres avec une symbolique puissante que nous avons décidé de nous approprier librement sous le prisme du féminisme. "
    humus_texte: "Et bien c’est un peu le phénix des forêts. L’humus c'est cette couche de terre noire et granuleuse qui sent bon la fraîcheur et les sous-bois quand on en prend dans nos mains. Il se crée par la décomposition des matières organiques - feuilles, écorces, carcasses, excréments. Il est entretenu par l'action combinée des animaux, des bactéries et des champignons du sol. C’est donc un sol vivant qui se régénère grâce aux déchets de son environnement. Et ses bienfaits sont considérables ! L’humus apporte beaucoup de nutriments essentiels pour toute la faune et la flore d’une forêt. Le mot humain·e vient d’ailleurs du latin «humus», qui signifie terre. Il y a de la vie dans la mort et de la mort dans la vie. Contrairement à ce que notre société occidentale veut nous faire croire, l’une est toujours accompagnée de l’autre. Si l’une advient, l’autre adviendra quoi qu’il arrive. La vie ouvre à la certitude de la mort et c’est parce que nous sommes mortel·le·s que la création survient. Nous voulons célébrer la mort autant que la vie, créer des liens intergénérationnels pour retrouver notre humanité. "
