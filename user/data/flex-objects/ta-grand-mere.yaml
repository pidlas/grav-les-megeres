ee241adcc4b0798eb328d9fa25a47d62:
  title: 'Ta Grand-Mère Sous Le Figuier'
  menu: 'Ta grand-mère sous le figuier'
  spectacle:
    texte_intro: "Le spectacle Ta grand-mère sous le figuier est le tout premier projet de la compagnie.\n\nSabine et Suzie décident de découvrir leur nouvelle terre d'accueil qu’est l’Aude. Elles se sont promenées dans ses forêts, baignées dans ses rivières et ont visité ses villages. C’est comme ça qu’elles se sont rendues compte qu’il y avait un fort pourcentage de personnes âgé·e·s et isolé·e·s, notamment des femmes."
    audio:
      mp3: spectacle5EHPAD.mp3
      ogg: spectacle5EHPAD.ogg
    image_lampe: lampe-horloge.avif
    texte_corps: 'Sous le prisme du féminisme, une des valeurs phare de la compagnie, Sabine et Suzie sont donc parties à la rencontre des vieilles dames de plus de 80 ans pour récolter leur témoignage de vie et enregistrer leur voix dans le but de créer un spectacle en leur honneur. Nous tenons à faire écouter les paroles des femmes en priorité car elles ont trop souvent été silenciées. Nous leur rendons la place centrale en leur offrant un espace unique d’expression. À partir de l’été 2022, les deux comédiennes ont interviewé 22 dames. Pour cela la compagnie est en étroite collaboration avec l’Ehpad Saint-Vincent-de-Paul à Montolieu depuis maintenant 3 ans. Une séance dure environ 1h. Nous nous déplaçons chez la personne accompagnées de notre micro. Nous lui faisons signer une autorisation de droit à l’enregistrement et à l’image et nous commençons l’entretien. Nous guidons la personne avec une liste de questions que nous avons peaufiné avec le temps.'
    questions_interview:
      -
        texte_question: 'Avez-vous un surnom ?'
      -
        texte_question: 'Partiez-vous en vacances quand vous étiez enfant ?'
      -
        texte_question: 'Quels étaient les métiers de vos parents ?'
      -
        texte_question: 'Et le vôtre ?'
      -
        texte_question: 'Quelles bêtises faisiez-vous quand vous étiez adolescente ?'
      -
        texte_question: 'Vous souvenez-vous d’un moment en particulier où vous avez ressentiti un bonheur intense ?'
      -
        texte_question: 'Voulez-vous nous le partager ? etc.'
    texte_conclusion: "Nous finissons l’entretien par une petite séance photo de la personne. Nous offrons les photos aux dames et/ou à leur famille pour qu’iels aient un joli souvenir de ce moment convivial.\n\nDans notre démarche artistique il y a toute une dimension de soin. Pendant 1h nous nous rendons entièrement disponible. C’est plus qu’un témoignage, c’est un vrai temps de rencontre. Toutes les femmes que nous avons enregistrées nous ont exprimées leur joie d’avoir passé des moments intimes et d'empouvoirement en notre compagnie. Elles pouvaient enfin déposer leurs expériences de vie en étant considérées et valorisées.\n\nNous sommes toujours à la recherche de nouvelles rencontres. Plus nous avons de témoignages, plus notre propos sera juste et universel. Si vous connaissez des dames âgées susceptibles d'être intéressées par notre projet, n'hésitez pas à nous [a url=\"/contact\" title=\"Accès à notre page Contact\"]contacter[/a]."
  meta_robots: 'noindex, nofollow'
  page_title: 'Ta Grand-Mère Sous Le Figuier | Un projet de collecte de paroles et de spectacle autour des femmes âgées, de la mémoire et de la transmission intergénérationnelle.'
  meta_description: 'Un projet de collecte de paroles et de spectacle autour des femmes âgées, de la mémoire et de la transmission intergénérationnelle.'
