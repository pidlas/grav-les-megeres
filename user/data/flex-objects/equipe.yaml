  image_alt: 'Marie Diel, Trésorière'
  citation: "L'essentiel c'est d'embrasser l'entièreté de ce que nous sommes, à la fois notre part d'ombre et nos lumières."
  citation_auteur: 'Ne marche pas si tu peux danser, Anne Van Stappen'
  bio_debut: "Originaire de Carcassonne, Marie a vécu 19 ans en Angleterre de 2001 à 2020. Elle y a passé un Bachelor Degree en Arts et Médias et a travaillé comme professeure de français et éducatrice spécialisée auprès d’enfants en difficulté.\n\nAujourd’hui Marie est rentrée en France. Apprentie naturopathe, elle est salariée dans une Biocoop et s’occupe du rayon Bien-être.\n\nElle a créé son entreprise [a url=\"https://fr.mademoiselleyogi.com\"]Mademoiselle Yogi[/a] avec laquelle elle donne des cours de yoga. \n\nC’est la reine du [a url=\"https://fr.wikipedia.org/wiki/Surcyclage\"]up-cycling[/a] et du bricolage ! Elle rénove et décore toute seule sa maison et c’est très joli ! Spécialisée dans la cuisine végétalienne, elle propose ses services en qualité de traiteur pour des évènements locaux et bio. C’est aussi une jardinière autodidacte.\n"
  bio_fin: 'Marie est une vraie petite abeille travailleuse, elle s’intéresse à tout, butine par-ci, par-là, elle est inarrêtable et passionnée !'
  meta_description: "Portrait de Marie Diel, trésorière de l'association et actrice du développement des Mégères de l'Humus."
