  image_alt: 'Sabine Rance, Responsable Artistique, Metteuse en scène, Comédienne'
  book_url: 'https://sabinerance.book.fr'
  citation: "Elle savait qu'on se remet de tout. Un peu de traviole, mais on repart"
  citation_auteur: 'Apocalypse bébé, Virginie Despentes'
  bio_debut: "Originaire de Rodez, Sabine s'oriente en 2009, après l'obtention de son Certificat d'Études Musicales en formation musicale et instrumentale, hautbois, vers des études plus théoriques.\n\nEn 2015, Sabine s'inscrit en Licence d'art du spectacle, option théâtre. Sa licence en poche, elle se tourne à nouveau vers la pratique et intègre [a url=\"https://www.ecoleclaudemathieu.com/\"]l'École Claude Mathieu[/a], Arts et Techniques de l'acteur, à Paris. Elle y approfondira ses qualités de danseuse, musicienne et comédienne.\n\nEn 2019, Sabine se consacre à l’art photographique en tant que modèle en menant des projets artistiques en partenariat avec les élèves de l'[a url=\"https://www.gobelins.fr/ecole\"]école des Gobelins[/a] à Paris.\n\nDe 2020 à 2023, elle tourne dans les collèges de la région Ile de France, et Orléans, avec la compagnie de théâtre forum, [a url=\"https://nomadiserane.com/\"]Nomad'i Serane[/a]."
  bio_fin: "Depuis Septembre 2020, elle est, tour à tour, régie, comédienne et réalisatrice sur le projet cinématographique *Concompliqué*. Elle travaille actuellement au sein de la compagnie *Les Mégères de l'Humus* comme comédienne et conteuse."
7204302437e415e65a74fbce18631205:
  nom: 'Muriel Lamy'
  slug: muriel
  role: Comédienne
  image:
    user/data/flex-objects/equipe/webJolie_ml.avif:
      name: webJolie_ml.avif
      type: image/avif
      size: 28945
      path: user/data/flex-objects/equipe/webJolie_ml.avif
      url: /user/data/flex-objects/equipe/webJolie_ml.avif
  classe_sup: posImage
  personne_image:
    user/data/flex-objects/equipe/webRigolote_ml.avif:
      name: webRigolote_ml.avif
      type: image/avif
      size: 22665
      path: user/data/flex-objects/equipe/webRigolote_ml.avif
      url: /user/data/flex-objects/equipe/webRigolote_ml.avif
  image_alt: Comédienne
  citation: 'La vie tricote.'
  citation_auteur: Marie
  bio_debut: "Originaire de Bretagne et de Lorraine, Muriel se sensibilise dès ses premières années d’études à la communication audiovisuelle. Elle consacre une grande partie de ses études à la réflexion sur le cinéma, les médias et la représentation. Elle développe l’esprit critique et l’analyse d’image à [a url=\"https://ieca.univ-lorraine.fr/\"]l’Institut Européen de Cinéma et d'Audiovisuel[/a].\n\nEn parallèle, elle développe sa pratique du théâtre en suivant des cours au [a url=\"https://conservatoire.grandnancy.eu/theatre/presentation\"]conservatoire régional du grand Nancy[/a] pendant plus de 3 ans.\n\nEn 2012 Muriel s’installe à Toulouse et entre en master à l[a url=\"https://www.ensav.fr/\"]’ENSAV[/a]. Elle y approfondit la recherche et l’expérimentation en axant son travail sur l’absurde et le burlesque dans le cinéma d’[a url=\"https://fr.wikipedia.org/wiki/Elia_Suleiman\"]Elia Suleiman[/a].\n\nEn 2014, elle intègre [a url=\"https://www.lehangar.org/\"]Le Hangar[/a] pour suivre une formation professionnelle de théâtre."
  bio_fin: "POUET\nCela lui ouvre un champs de techniques et de pratiques théâtrales plus contemporaines. Muriel s’amuse et explore les possibilités infinies d’interprétation de l’acteurice. Elle y travaille notamment l’improvisation et y joue dans une mise en scène de Didier Roux, [a url=\"https://labellecie.org/creation/page6/index.html\"]Perdre connaissance[/a]. Elle intègre par ailleurs un laboratoire de recherche dirigé par <em>Isabelle Luccioni</em>.\n\nEn 2017, Muriel se diversifie davantage en jouant pour du jeune public avec la [a url=\"https://cie-artemisia.com/\"]compagnie Artémisia[/a] et se forme à la pédagogie avec <em>Les Ateliers d’Eauvive</em>.\n\nEn 2022, elle intègre le [a url=\"https://kazico.net/\"]Quasi-collectif[/a] avec lequel elle cocrée une fable jeune public sur l’amitié, <em>Une Vie de Mouche</em> et un spectacle sur le voyage et le deuil, <em>Ça va</em>.\n\nEn 2026, elle rejoint la <em>Cie Les Mégères de l’Humus</em> pour jouer dans [a url=\"/spectacles/gresilhette-et-la-salimonde\"]Grésilhette et la Salimonde[/a], un spectacle jeune public et [a url=\"/theatre-forum/le-spectacle\"]Le spectacle : 0’Pression[/a], un spectacle de Théâtre Forum. C’est l’occasion pour Muriel de se renouveler encore et toujours."
  meta_description: "Découvrez Muriel Lamy, comédienne associée aux créations et spectacles des Mégères de l'Humus."
817cc83d6aa2d4ab5df446416bf94e49:
  nom: 'Anne Spielmann'
  slug: anne
  role: "Metteuse en scène, comédienne\nPlasticienne, Scénographe"
  image:
