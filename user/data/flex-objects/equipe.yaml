  image_alt: "Delphine Verniol, présidente de la Cie Les Mégères de l'Humus"
  citation: 'Faire les choses sérieusement, sans se prendre au sérieux.'
  citation_auteur: 'Bertrand Belin'
  bio_debut: "Originaire de Figeac, Delphine grandit dans cet écrin de verdure de la région Occitanie. Depuis toujours c'est une grande sportive. Elle fait du VTT, de la marche à pied et des sports collectifs en tout genre.\n\nEn 2000, elle passe son Baccalauréat Sciences et Technologies Ternaires, option comptabilité et gestion.\n\nEn 2009, Delphine se réoriente et passe le diplôme d'*assistante sociale* à Perpignan. Elle exerce ensuite au *Conseil Départemental des Pyrénées Orientales* puis à la mairie de Montauban.\n\nProche de la nature et militante écologiste, elle passe en 2013 une Licence Agriculture Biologique, Conseil et Développement à l’[a url=\"https://ineopole-mfr.com/\"]Inéopole[/a] et au [a url=\"https://campusterreetnature.fr/\"]Centre de Formation pour Adultes sur le Campus Terre & Nature[/a] du lycée Charlemagne de Carcassonne. Avec ce nouveau diplôme en poche, elle est rapidement embauchée au [a url=\"https://www.bio-aude.com/\"]Biocivam[/a], association de producteurs écologiques de l’Aude, en tant que chargée administrative et de la communication. Elle y restera 8 ans."
  bio_fin: "En parallèle elle devient responsable de la cave à la [a url=\"https://www.tourne-sol-biocoop.fr/\"]Biocoop Tourne-Sol[/a] de Carcassonne. Elle fournira ses conseils et s'occupera de ce rayon pendant 10 ans. Depuis 2019, Delphine est pompier volontaire à la caserne d'[a url=\"https://sdis11.fr/centre-de-secours-alzonne/\"]Alzonne[/a]. En parallèle, elle travaille dans un *EHPAD* en tant qu’adjointe administrative.\n\nMis à part ce parcours fourni d’expériences différentes et oh combien ! formatrices, Delphine a pratiqué le théâtre dans une troupe amateur à Montauban, à Carcassonne et à Perpignan où elle a pratiqué du [a url=\"https://fr.wikipedia.org/wiki/Playback_Th%C3%A9%C3%A2tre\"]théâtre Playback[/a]."
  meta_description: "Découvrez le parcours de Delphine Verniol, présidente de la Cie et soutien essentiel des Mégères de l'Humus."
103450043c556de6b564b2467ae41595:
  nom: 'Marie Diel'
  slug: marie
  role: Trésorière
  image:
    user/data/flex-objects/equipe/webJolie_md.avif:
      name: webJolie_md.avif
