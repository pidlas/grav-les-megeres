  image_alt: 'Metteuse en scène, Comédienne, Plasticienne, Scénographe'
  citation: "Puisque ces mystères me dépassent, feignons d'en être l'organisateur."
  citation_auteur: 'Les Mariés de la Tour Eiffel, Jean Cocteau'
  bio_debut: "Originaire de Nancy, Anne obtient, par amour de la bidouille, en 1985 un master d’Arts Plastiques à l’université de Strasbourg.\n\nEnsuite, elle s’initie à la pratique théâtrale avec [a url=\"https://yoshioida.com/\"]Yoshi Oida[/a], [a url=\"https://claireheggen.theatredumouvement.fr/\"]Claire Heggen, le théâtre du mouvement[/a], [a url=\"https://fr.wikipedia.org/wiki/Anna_Prucnal\"]Anna Prucnal[/a] et [a url=\"https://fr.wikipedia.org/wiki/Jeanne_Biras\"]Jeanne Biras[/a] entre autres. Étiquetée comme Conceptrice de théâtre d’objet, Anne intervient depuis près de 40 ans dans la création et la réalisation de spectacles essentiellement visuels pour tous publics.\n\nAnne partage le goût du jeu avec les enfants, ainsi que la poésie, l'intelligence, la joie de surprendre et l'humour."
  bio_fin: "Elle adore créer des moments où s’éveillent la curiosité et l’émotion de chacun·e, sans distinction d’âge, de classe sociale ou de nationalité.\n\nAnne travaille comme conceptrice de spectacle et interprète au sein de la compagnie *Les Babas au Rhum* depuis 1985. Elle intervient également pour d’autres compagnies telles que le [a url=\"https://tjp-strasbourg.com\"]TJP - Centre Dramatique National de Strasbourg[/a], la *Compagnie Jardins insolites* à Angers et la [a url=\"https://lalouetheatre.com\"]Compagnie Théâtre de La Loue[/a] à Narbonne.\n\nElle accompagne à la mise-en-scène depuis une quinzaine d’années des artistes, musicien·ne·s et comédien·ne·s dont [a url=\"https://lesfrereslocomotive.com\"]La Fanfare Toto[/a], [a url=\"https://lamalcoiffee.com\"]La Mal Coiffée[/a] et depuis 2024 la compagnie *Les Mégères de l’Humus*."
f6ea20b67c40e917e216154e6d4c1871:
  nom: 'Delphine Verniol'
  slug: delphine
  role: Présidente
  image:
    user/data/flex-objects/equipe/webJolie_dv.avif:
      name: webJolie_dv.avif
