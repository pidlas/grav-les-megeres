  image_alt: 'Philippe Guerrini Idlas, dit Quiligus, dev, auto-hébergeur, philosophe des bacs à sable'
  citation: "Le dormeur doitt s'éveiller."
  citation_auteur: 'Duc Leto Atréides - Dune, Frank Herbert'
  bio_debut: "Originaire de Paris, Philippe a sillonné la France, sa famille d'origine ayant circulé entre le sud marseillais, l'est vosgien et Paris.\n\nIl obtient un DEUG en sciences économiques en 1980 à l'université Paris Nord 13 et décide d'aller rejoindre son frère en Israël pour expérimenter la vie collective dans un kibbutz, à Or Haner, tout près de la ville d'Ashkelon. Il y reste 2 ans, dont 6 mois sur un Ulpan dans le nord d'Israël, pour y apprendre l'hébreu moderne.\n\nLe retour en France l'emmène à s'inscrire dans une cursus diplômant à l'[a url=\"https://iutv.univ-paris13.fr/?sitemap\"]IUT de Villetaneuse[/a]. Il y décroche le diplôme universitaire de technologie en Informatique.\n\nS'ensuit une carrière de 20 ans dans de grandes entreprises informatiques comme spécialiste du système PICK&reg;, puis comme spécialiste du progiciel Baan&reg;, et enfin, comme consultant en système d'information, spécialisé dans la réorganisation des services informatiques."
  bio_fin: "Après une reconversion de 3 ans, Philippe s'installe, dès 2005, comme praticien professionnel en kinésiologie dans le sud de l'Essonne. Sa formation et l'accompagnement d'enfants en difficulté d'apprentissage oriente Philippe vers le métier de professeur des écoles. Il passe le concours en 2007 et enseigne en classes élémentaires et en collège jusqu'en 2015.\n\nDe 2015 à 2020, il rejoint les équipes informatiques du rectorat de Versailles pour y assurer le support des collèges et lycées du 78 puis du 91. Depuis son départ à la retraite, Philippe vit, avec son épouse, dans un village de l'Essonne où ils se sont installés en 1992."
  meta_description: "Portrait de Philippe Guerrini Idlas, artisan de la partie technique et soutien numérique des Mégères de l'Humus."
