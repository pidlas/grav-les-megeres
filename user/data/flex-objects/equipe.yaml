  image_alt: 'Suzie Idlas, Responsable Communication, Metteuse en scène, Comédienne'
  citation: "Je veux juste la Terre que j'adore"
  citation_auteur: 'Testament, Vita Sackville West'
  bio_debut: "Suzie est comédienne et conteuse. En 2011 elle passe son baccalauréat Littéraire en option lourde Théâtre au Lycée René Cassin à Arpajon (91).\n\nDepuis 2009, elle joue dans plusieurs créations entre l’île de France, Toulouse et l'Aude. En 2015, elle se forme à la langue des signes à l'[a url=\"https://ivt.fr\"]International Visual Theatre[/a] à Paris et en 2020 à l'art de conter au [a url=\"https://www.theatredelaparole.be/\"]Théâtre de la parole[/a] à Bruxelles.\n\nSuzie est aussi autrice. Elle écrit un recueil de poésies *l’Esquisse Folle* qui retrace son parcours de jeune adulte dans un monde patriarcal.\n\nElle est publiée dans les recueils n°2 et n°3 du collectif Format Papier basé à Lausanne. En 2018 elle écrit une pièce de théâtre *Ta boue* qui parle des rapports toxiques dans les relations hétéronormées."
  bio_fin: "Elle expérimente le milieu du cinéma dans plusieurs domaines : voix off - comédienne pour un court métrage et régisseuse principale pour le tournage d'une web série. C'est en 2022 que Suzie se lance à la découverte de sa pleine créativité en travaillant au sein de la compagnie de théâtre *Les Mégères de l'Humus*. Elle crée notamment le spectacle *Grésilhette et la Salimonde* coécrit avec sa collègue Sabine Rance."
