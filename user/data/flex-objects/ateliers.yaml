  ateliers_description: "Parmi les prestations, les ateliers des *Mégères de l'Humus* sont conçus comme des espaces de pratique, d'expression et de création collective. Ces ateliers peuvent s'adresser aux enfants, aux adolescent·e·s, aux adultes ou à des groupes intergénérationnels selon les projets.\n\nÀ travers le jeu, l'improvisation, l'écoute et la prise de parole, la compagnie propose des formats adaptés aux contextes scolaires, associatifs, culturels ou territoriaux.\n\nCes ateliers sont personnalisés en fonction de vos attentes et de vos objectifs. N'hésitez pas à nous [a url=\"/contact\" title=\"Accès à notre page Contact\"]contacter[/a] !\n"
