      -
        texte: "Développer les compétences relationnelles (écoute, empathie, respect d'autrui...)."
      -
        texte: 'Favoriser la capacité à agir et à prendre la parole.'
      -
        texte: "Expérimenter collectivement des alternatives pour sortir d'une situation difficile."
      -
        texte: 'Introduire des informations et des éléments clés sur les thématiques abordées.'
