    scolaires_tarifs: 'Pour connaître les tarifs, [a href="/contact" title="Accès à notre page Contact"]contactez-nous[/a]'
    tout_public_intro: "Sensibilisation interactive par le Théâtre-Forum pour les entreprises, associations, équipes pédagogiques, centres de loisirs, théâtres, festivals, collectivités territoriales, écoles supérieures et toutes autres structures intéressées.\n\nNous proposons le spectacle de Théâtre-Forum *O'Pression* afin de sensibiliser les adultes de 18 à 99 ans à des problématiques sociales de manière interactive (discriminations, oppressions, conflits, questions d'actualité...).\n\nDans un cadre bienveillant et ludique, le public peut alors réfléchir, s'exprimer et agir autour de problématiques parfois difficiles à aborder."
