  title: 'Mentions Légales'
  menu: 'Mentions légales'
  meta_description: "Mentions légales et Conditions Générales d'Utilisation du site Les Mégères de l'Humus."
  page_intro: "- [u]Nom[/u] : Les Mégères de l'Humus\n- [u]Adresse du siège[/u] : 7 rue du 19 mars 1962 11170 Moussoulens\n- [u]Coordonnées[/u] : 06 95 19 25 35 ou pour nous [a url=\"/contact\" title=\"Accès à notre page Contact\"]contacter[/a]\n- [u]SIRET[/u] : 917 798 191 00016\n- [u]Forme juridique[/u] : Association loi 1901\n- [u]Propriétaires[/u] : M. Sabine Rance, M. Suzie Idlas\n- [u]Responsables de publication[/u] : M. Sabine Rance, M. Suzie Idlas\n- [u]Conception et réalisation[/u] : conçu par M. Sabine Rance et M. Suzie Idlas - réalisé par M. Philippe Guerrini Idlas dit Quiligus\n- [u]Hébergement[/u] : le site, propulsé par [a url=\"https://yunohost.org\" title=\"Accès au site de YunoHost\"]YunoHost[/a], est auto-hébergé sur du matériel libre la [a url=\"https://labriqueinter.net\" title=\"Accès au site de la Brique Internet\"]Brique Internet[/a] et promeut les logiciels libres."
  page_sections:
    -
      titre_section: 'Article 1 - Accès au site'
      contenu_section: "Les informations et documents du site sont présentés à titre indicatif, sans de caractère exhaustif, et ne peuvent engager la responsabilité des propriétaires du site. Les propriétaires du site ne peuvent être tenues responsables des dommages directs et indirects consécutifs à l’accès au site. Le site est accessible gratuitement en tout lieu à tout Utilisateur ayant un accès à Internet. Tous les frais supportés par l'Utilisateur pour accéder au service (matériel informatique, logiciels, connexion Internet, etc.) sont à sa charge.\n\nLe site _https://lesmegeresdelhumus.fr_ permet à l'Utilisateur un accès gratuit aux services suivants :\n\n* des informations générales sur la compagnie de théâtre\n* des informations spécifiques sur la compagnie de théâtre\n* des informations spécifiques sur les spectacles de la compagnie\n* des témoignages de participant·e·s à des séances de travail autour de recueil de la parole de personnes âgées\n* des informations spécifiques sur les cours et les stages donnés par la compagnie de théâtre"
    -
      titre_section: 'Article 2 - Collecte des données'
      contenu_section: "Le site _Les Mégères de l'Humus_ est un site purement institutionnel. Il ne collecte, ne stocke et ne traite aucune donnée à caractère personnel. Il ne requiert l'usage d'aucun cookie non essentiel au fonctionnement technique de la navigation. Le site est, par conséquent, exempté de déclaration à la Commission Nationale Informatique et Libertés (CNIL) dans la mesure où il ne collecte aucune donnée personnelle sous forme de formulaire de contact, d'espace membre ou de traceur/cookie statistique."
    -
      titre_section: 'Article 3 - Propriétés Intellectuelles'
      contenu_section: "Sauf mention contraire, tous les éléments accessibles sur le site (textes, images, graphismes, logo, icônes, sons, logiciels, etc.) restent la propriété exclusive de leurs auteur·e·s, en ce qui concerne les droits de propriété intellectuelle ou les droits d’usage. L'Utilisateur doit solliciter l'autorisation préalable du site pour toute reproduction, publication, copie des différents contenus. Il s'engage à une utilisation des contenus du site dans un cadre strictement privé, toute utilisation à des fins commerciales et publicitaires est strictement interdite. Toute représentation totale ou partielle de ce site par quelque procédé que ce soit, sans l’autorisation expresse de l’exploitant du site Internet, constituerait une contrefaçon sanctionnée par l’article L. 335-2 et suivants du Code de la propriété intellectuelle. Il est rappelé conformément à l’article L.122-5 du Code de propriété intellectuelle que l’Utilisateur qui reproduit, copie ou publie le contenu protégé doit citer l’auteur·e et sa source."
    -
      titre_section: 'Article 4 - Responsabilité'
      contenu_section: "Les sources des informations diffusées sur le site _https://lesmegeresdelhumus.fr_ sont réputées fiables mais le site ne garantit pas qu’il soit exempt de défauts, d’erreurs ou d’omissions. Les informations communiquées sont présentées à titre indicatif et général sans valeur contractuelle. Malgré des mises à jour régulières, le site _https://lesmegeresdelhumus.fr_ ne peut être tenu responsable de la modification des dispositions administratives et juridiques survenant après la publication. De même, le site ne peut être tenu responsable de l’utilisation et de l’interprétation de l’information contenue dans le site. Le site _https://lesmegeresdelhumus.fr_ ne peut être tenu pour responsable d’éventuels virus qui pourraient infecter l’ordinateur ou tout matériel informatique de l’Utilisateur, suite à une utilisation, à l’accès, ou au téléchargement provenant de ce site. La responsabilité du site ne peut être engagée en cas de force majeure ou du fait imprévisible et insurmontable d'un tiers."
    -
      titre_section: 'Article 5 - Liens hypertextes'
      contenu_section: "*Liens sortants* : Des liens hypertextes peuvent être présents sur le site. L’Utilisateur est informé qu’en cliquant sur ces liens, il sortira du site _https://lesmegeresdelhumus.fr_. Les liens sortants ouvrent une nouvelle fenêtre de navigation. Les responsables du site n’ont pas de contrôle sur les pages web sur lesquelles aboutissent ces liens. Iels ne sauraient, en aucun cas, être tenu·e·s responsables de leur contenu.\n\n*Liens entrants* : Les propriétaires du site autorisent les liens hypertextes vers l’une des pages de ce site uniquement sur demande spécifique et à condition que ceux-ci ouvrent une nouvelle fenêtre et soient présentées de manière non équivoque afin d’éviter tout risque de confusion entre le site citant et les propriétaires du site ainsi que toute présentation tendancieuse, ou contraire aux lois en vigueur. Les propriétaires du site se réservent le droit de demander la suppression d’un lien s’iels estiment que le site source ne respecte pas les règles ainsi définies.\n\n*Liens entre les pages du site* : D'autres liens hypertextes peuvent être présents entre les pages du site. L’Utilisateur est informé qu’en cliquant sur ces liens, il restera sur le site _https://lesmegeresdelhumus.fr_. Les liens entre les pages du site n'ouvrent pas une nouvelle fenêtre de navigation.\n"
    -
      titre_section: 'Article 6 - Cookies'
      contenu_section: 'L’Utilisateur est informé que lors de ses visites sur le site, un cookie système peut s’installer automatiquement sur son logiciel de navigation. Les cookies sont de petits fichiers stockés temporairement sur le disque dur de l’ordinateur de l’Utilisateur par le navigateur. Ils sont nécessaires à l’utilisation du site _https://lesmegeresdelhumus.fr_. Les cookies ne contiennent pas d’information personnelle et ne peuvent pas être utilisés pour identifier quelqu’un. Un cookie contient un identifiant unique, généré aléatoirement et donc anonyme. Certains cookies expirent à la fin de la visite de l’Utilisateur, d’autres restent plus longtemps. L’information contenue dans les cookies est utilisée pour améliorer le site _https://lesmegeresdelhumus.fr_. En naviguant sur le site, l’Utilisateur les accepte. L’Utilisateur pourra désactiver ces cookies par l’intermédiaire des paramètres figurant au sein de son logiciel de navigation.'
    -
      titre_section: 'Article 7 - Confidentialité'
      contenu_section: "L'Utilisateur disposerait d’un droit d’accès, de rectification et d’opposition aux données personnelles le concernant, si le site stockait des informations personnelles. Le site _https://lesmegeresdelhumus.fr_ ne recueille pas d’informations personnelles, et n’est pas assujetti à déclaration à la CNIL."
    -
      titre_section: 'Article 8 - Crédits'
      contenu_section: "Les photos appartiennent au site *https://lesmegeresdelhumus.fr*. Les logos sont la propriété des entreprises dépositaires des marques associées. Pour connaître la liste complète des crédits, vous pouvez vous reporter sur la page interne au site [a url='/credits' title=\"Accès à la page Crédits\" class=\"lien-interne\"]Crédits[/a].\n"
    -
      titre_section: 'Article 9 - Droit applicable et juridiction compétente'
      contenu_section: "La législation française s'applique au présent contrat. En cas d'absence de résolution amiable d'un litige né entre les parties, les tribunaux français seront seuls compétents. Pour toute question relative à l'application des présentes CGU, vous pouvez joindre l'éditeur aux coordonnées inscrites dans les mentions légales."
    -
      titre_section: 'Article 10 - Les textes de loi'
      contenu_section: "* Articles L.111-1 et suivants du Code de la Propriété Intellectuelle du 1^er^ juillet 1992\n* Article L.41 de la loi du 11 mars 1957\n* Article L.226-13 du Code pénal et la Directive Européenne du 24 octobre 1995\n* Articles L.335-2 et suivants du Code de Propriété Intellectuelle\n* Loi n° 78-87 du 6 janvier 1978, modifiée par la loi n° 2004-801 du 6 août 2004, relative à l’informatique, aux fichiers et aux libertés\n* Articles 38 et suivants de la loi L.78-17 du 6 janvier 1978 relative à l’informatique, aux fichiers et aux libertés\n* Loi du 1^er^ juillet 1998 transposant la directive 96/9 du 11 mars 1996 relative à la protection juridique des bases de données\n* Loi n° 2004-801 du 6 août 2004\n* Article 6 de la loi n° 2004-575 du 21 juin 2004 pour la confiance dans l’économie numérique"
  page_title: "Mentions Légales |  Mentions légales et Conditions Générales d'Utilisation du site Les Mégères de l'Humus."
