8b09464eef774cb5a33f4ffd9b790277:
  slug_page: reglement-interieur
  title: 'Règlement intérieur'
  menu: 'Règlement Intérieur'
  meta_description: "Consultez le règlement intérieur applicable aux cours et stages proposés par la compagnie Les Mégères de l'Humus."
  page_sections:
    -
      titre_section: 'Article 1 - Introduction'
      contenu_section: 'L’inscription à une prestation avec la compagnie Les Mégères de l’Humus implique d’avoir pris connaissance et accepté les conditions de ce règlement intérieur. '
    -
      titre_section: 'Article 2 - Dispositions légales'
      contenu_section: "La Compagnie *Les Mégères de l’Humus* est une compagnie de théâtre professionnelle qui existe sur le Territoire de l’Aude depuis 2022.\nCette association loi 1901 est dirigée par un bureau. Celui-ci est dirigé par Madame Delphine Verniol. Les intervenant·e·s des prestations dispensées\npar la compagnie, sont doté·e·s d’une expérience professionnelle pédagogique et scénique. Les tarifs de ces prestations sont établis\nannuellement. Toute personne le souhaitant peut participer aux prestations  ;  seuls des critères d’âge limitent l’admission. L’âge minimum requis\nest de 8 ans. L’élève ou son/sa responsable légal ·e s’engage à souscrire à une assurance responsabilité civile couvrant son activité lors\ndu suivi des prestations, des répétitions et du spectacle de fin d’année. Les élèves mineur·e·s ne sont sous la responsabilité de l’association et de\nl’intervenant ·e que pendant la durée des prestations. Iels ne peuvent être ni accueilli·e·s avant, ni gardé·e·s après la séance. La compagnie\n*Les Mégères de l’Humus* se dégage de toute responsabilité dès la fin de la séance."
    -
      titre_section: 'Article 3 - Fréquence, Lieu et Durée'
      contenu_section: "Les prestations se déroulent aux jours, horaires et lieux définis en début d’année. Elles ont lieu tout au long de l'année. Le lieu, le jour et les horaires des séances sont susceptibles d’être modifiés. Des répétitions supplémentaires peuvent être ajoutées pour le bon déroulement du spectacle. La compagnie *Les Mégères de l’Humus* s’engage à prévenir les participant·e·s de toutes modifications pouvant survenir. Si l'intervenant·e ne peut assurer une séance, celle-ci sera reportée dans la mesure du possible, ou annulée."
    -
      titre_section: 'Article 4 - Tenues et Comportements'
      contenu_section: "Afin que les séances commencent à l’heure et pour le bon déroulement de celles-ci, il est demandé aux élèves d’arriver avec 5 minutes d'avance. Une fréquentation régulière est souhaitable pour l'intégration de chacun·e au sein du groupe et pour l'acquisition des compétences tout au long de l'année. Le théâtre est un loisir qui repose sur le sens du collectif et la responsabilité de chacun·e vis-à-vis du groupe. Toute absence doit être signalée à l’intervenant·e, tout retard exceptionnel également. Les téléphones portables devront être éteints pendant la séance afin de bien respecter l’ambiance de travail et de concentration nécessaires au théâtre. Le théâtre est un art qui engage le corps. La tenue des élèves doit être adaptée aux séances de théâtre, qui demandent souvent une mobilité corporelle et une aisance dans les mouvements. Il est vivement conseillé de laisser à la maison bijoux et objets de valeur. En cas de perte, détérioration ou vol, la compagnie *Les Mégères de l’Humus* se dégage de toute responsabilité. Les élèves s’engagent à respecter les règles de rangement et à prendre soin du matériel, des accessoires, décors et costumes mis à disposition par la compagnie *Les Mégères de l’Humus* pour le bien des répétitions et de l’enseignement. Tout élève se doit aussi de respecter le matériel et le bâtiment communal *La Maison du Temps Libre*, mis à disposition par la mairie. Aucune dégradation ne sera autorisée sous peine d’exclusion. Pour finir, les élèves s’engagent à ne pas tenir de propos racistes, validistes, grossophobes, psychophobes, homophobes et transphobes."
  page_title: "Règlement Intérieur | Consultez le règlement intérieur applicable aux cours et stages proposés par la compagnie Les Mégères de l'Humus."
  meta_robots: 'noindex, nofollow'
b365e6d9f242aa7f93fb749d80ab02c8:
  slug_page: credits
  title: Crédits
  menu: Crédits
  meta_description: 'Crédits du site et remerciements aux personnes ayant contribué aux photographies, graphismes, contenus et ressources.'
  page_sections:
    -
      titre_section: 'Conception du site'
      contenu_section: "Le site a été conçu en collaboration entre Philippe Guerrini Idlas et Les Mégères de l'Humus. "
    -
      contenu_section: "Les Conditions Générales d'Utilisation - CGU - ont été réalisées à partir des conseils fournis par le portail de la transformation numérique des entreprises, article publié le 8 février 2021 et mis à jour le 21 janvier 2025."
      titre_section: "Conditions Générales d'Utilisation"
    -
      titre_section: 'Crédit photographique'
      contenu_section: "La *Compagnie Les Mégères de l'Humus* a bénéficié pour les photographies de ces équipes du travail de [a url=\"http://laeve.fr\" title=\"Accès au site de la photographe\"]Laetitia Van Eersel[/a],\nphotographe professionnelle. Nous vous conseillons d'aller visiter son site pour vous rendre compte de la qualité et de l'originalité de son\ntravail artistique."
    -
      contenu_section: "Le site a été développé par Quiligus en HTML5, CSS3, Javascript et PHP pour gérer le référencement et la sécurité. Quiligus est en passe de migrer ce site vers le CMS GRAV. Pour ce faire, une réécriture complète a été nécessaire pour répondre aux exigences techniques du CMS, pour intégrer les règles de l'art en matière de développement d'un site reposant sur des fichiers de contenus utilisant l'éditeur Markdown, sur le framework Spectre pour la gestion du design et le langage twig pour la logique applicative."
      titre_section: Développement
    -
      titre_section: Graphismes
      contenu_section: "Les graphismes ont été conçus et réalisés par la graphiste Juliette Gaubert.\n"
    -
      titre_section: Hébergement
      contenu_section: 'Le site est hébergé chez Philippe Guerrini Idlas. Le serveur est un matériel Open Source doté d''un processeur anglais ARM construit sur une carte hongroise de la société Olimex. Le serveur tourne sous armbian, une version Debian pour le processeur ARM. La gestion internet est assurée par une solution Open Source, [a url="https://yunohost.org/#/" title="Accès au site YunoHost"]YunoHost[/a]. Le nom de domaine *lesmegeresdelhumus.fr* est géré par le registrar [a url="https://www.gandi.net/fr" title="Accès au site de Gandi"]Gandi[/a].'
    -
      titre_section: Icônes
      contenu_section: 'L''icône représentant l''association dans la page Contacts provient de la banque d''icônes du site [a url="https://www.flaticon.com/free-icons/join" title="join icons"]Join icons created by Freepik - Flaticon[/a].'
    -
      titre_section: Logo
      contenu_section: "Le logo a été conçu et réalisé par l'illustrateurice Geminga."
    -
      titre_section: 'Mentions Légales'
      contenu_section: 'Les mentions légales ont été réalisées à partir des conseils fournis par le portail de la transformation numérique des entreprises, article publié le 8 février 2021 et mis à jour le 21 janvier 2025.'
  page_title: 'Crédits | Crédits du site et remerciements aux personnes ayant contribué aux photographies, graphismes, contenus et ressources.'
  meta_robots: 'noindex, nofollow'
