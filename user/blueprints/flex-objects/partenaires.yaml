type: flex-objects
title: Partenaires
description: Gestion centralisée des logos, des noms et des sites internet des partenaires culturels et institutionnels.

config:
  data:
    storage:
      className: 'Grav\Framework\Flex\Storage\FolderStorage'
      options:
        formatter:
          class: 'Grav\Framework\File\Formatter\YamlFormatter'
        # 🌟 LOGIQUE CENTRALISÉE : Stockage de la liste dans user/data/
        folder: 'user/data/flex-objects/partenaires' 
    media:
      per_object: false

  site:
    templates:
      object:
        route: /infos/partenaires
        template: partenaires

  # 🌟 LOGIQUE ADMIN ALIGNÉE SUR LES ACTUALITÉS ET GRÉSILHETTE
  admin:
    router:
      path: /partenaires
    menu:
      list:
        route: /partenaires
        title: Page Partenaires
        priority: 3
        icon: fa fa-handshake-o
    list:
      title: Liste des Partenaires
      ordering:
        nom: asc
      fields:
        nom:
          title: Nom du partenaire
          link: edit
        url:
          title: Site Internet

form:
  fields:
    nom:
      type: text
      label: 'Identifiant / Nom du partenaire'
      help: 'Obligatoire. Ce nom sert à lister le partenaire dans le tableau.'
      validate:
        required: true
        
    url:
      type: text
      label: 'Lien du site internet (URL)'
      placeholder: 'https://exemple.com'
      validate:
        type: url

    # 🌟 MODERNISATION : Passage au type file applicatif relatif sans "user/"
    image:
      type: file
      label: Choisir le logo du partenaire
      destination: 'data/flex-objects/partenaires'
      multiple: false
      preview_images: true
      accept:
        - .avif