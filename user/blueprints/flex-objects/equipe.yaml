type: flex-objects

title: Page Équipe
description: Gestion conviviale des membres de l'équipe

config:
  data:
    storage:
      className: 'Grav\Framework\Flex\Storage\FolderStorage'
      options:
        formatter:
          class: 'Grav\Framework\File\Formatter\YamlFormatter'
        folder: 'user/data/flex-objects/equipe'
    media:
      per_object: false
  # 🌟 LA CORRECTION HUMAINE QUI MANQUE ICI :
  # On dit au blueprint lui-même comment calculer la route de l'objet
  site:
    templates:
      object:
        route: /infos/equipe

  # 🌟 LE TABLEAU ICI : Parfaitement imbriqué sous "config" comme pour Partenaires
  admin:
    router:
      path: /equipe
    menu:
      list:
        route: /equipe
        title: Page Équipe
        priority: 4
        icon: fa fa-users
    list:
      title: Liste de l'Équipe
      ordering:
        nom: asc
      fields:
        nom:
          title: Nom
          link: edit
        role:
          title: Rôle
        slug:
          title: Slug URL

form:
  fields:
    tabs:
      type: tabs
      active: 1
      fields:
        
        tab_liste:
          type: tab
          title: "Aperçu Liste"
          fields:
            nom:
              type: text
              label: "Nom"
            slug:
              type: text
              label: "Slug"
            role:
              type: textarea
              label: "Rôle"
            classe_sup:
              type: text
              label: "Classe Sup"
            image:
              type: file
              label: "Image Jolie"
              destination: data/flex-objects/equipe

        tab_biographie:
          type: tab
          title: "Page Biographie"
          fields:
            personne_image:
              type: file
              label: "Image Rigolote"
              destination: data/flex-objects/equipe
            image_alt:
              type: text
              label: "Image Alt"
            book_url:
              type: text
              label: "Book URL"
            citation:
              type: text
              label: "Citation"
            citation_auteur:
              type: text
              label: "Citation Auteur"
            bio_debut:
              type: markdown
              label: "Début de la biographie"
            bio_fin:
              type: markdown
              label: "Fin de la biographie"
            meta_description:
              type: text
              label: "Description SEO (Meta Description)"
              description: "Texte court (environ 150 caractères) pour les moteurs de recherche."