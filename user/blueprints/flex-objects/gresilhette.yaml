type: flex-objects
title: Grésilhette et la Salimonde
description: Gestion des médias, vidéos et informations du spectacle Grésilhette et la Salimonde

config:
  data:
    storage:
      className: 'Grav\Framework\Flex\Storage\FolderStorage'
      options:
        formatter:
          class: 'Grav\Framework\File\Formatter\YamlFormatter'
        # 🌟 ANCRAGE : Fichier unique global de collection stocké dans user/data
        folder: 'user/data/flex-objects/gresilhette' 
    media:
      per_object: false

  site:
    templates:
      object:
        route: /spectacles/gresilhette-et-la-salimonde

  admin:
    router:
      path: /gresilhette
    menu:
      list:
        route: /gresilhette
        title: Page Grésilhette
        priority: 2
        icon: fa fa-ticket
    list:
      title: Liste des Spectacles
      fields:
        title:
          title: Titre du spectacle
          field: title
          link: edit

form:
  fields:
    tabs:
      type: tabs
      active: 1
      fields:

        tab_general:
          type: tab
          title: "Informations Générales"
          fields:
            title:
              type: text
              label: Titre de la page
              validate:
                required: true
            menu:
              type: text
              label: Titre dans le menu du site
            subtitle:
              type: text
              label: Sous-titre (Optionnel)
            spectacle.age_duree:
              type: text
              label: Âge et Durée du spectacle
              placeholder: "Ex: Spectacle jeune public dès 6 ans - 40 mn"
            
            section_video:
              type: section
              title: "Teaser Vidéo"
              underline: true
            spectacle.video.mp4:
              type: filepicker
              label: Sélectionner le teaser vidéo MP4
              folder: 'user/data/flex-objects/gresilhette'
              preview_images: false
              accept:
                - .mp4
            spectacle.video.webm:
              type: filepicker
              label: Sélectionner le teaser vidéo WebM
              folder: 'user/data/flex-objects/gresilhette'
              preview_images: false
              accept:
                - .webm

            section_histoire_1:
              type: section
              title: "Introduction de l'histoire"
              underline: true
            spectacle.texte_intro:
              type: markdown
              label: "Premier paragraphe (ex: Le spectacle aborde le thème...)"

            section_grille_commune:
              type: section
              title: "Images des 3 ronds de navigation (Grille)"
              underline: true
            spectacle.grille.ombres:
              type: filepicker
              label: "Rond pour le Théâtre d'ombres"
              folder: 'user/data/flex-objects/gresilhette'
              preview_images: true
              accept:
                - .avif
            spectacle.grille.sieste:
              type: filepicker
              label: "Rond pour la Sieste contée"
              folder: 'user/data/flex-objects/gresilhette'
              preview_images: true
              accept:
                - .avif
            spectacle.grille.projet:
              type: filepicker
              label: "Rond pour le Projet pédagogique"
              folder: 'user/data/flex-objects/gresilhette'
              preview_images: true
              accept:
                - .avif

            section_histoire_2:
              type: section
              title: "Suite de l'histoire"
              underline: true
            spectacle.texte_suite:
              type: markdown
              label: "Les 2 paragraphes suivants (ex: Ce conte s'inspire de la légende...)"

            section_dossier:
              type: section
              title: "Dossier Artistique Principal"
              underline: true
            spectacle.dossier_pdf:
              type: filepicker
              label: Sélectionner le dossier artistique (PDF)
              folder: 'user/data/flex-objects/gresilhette'
              accept:
                - .pdf
            spectacle.dossier_img:
              type: filepicker
              label: Sélectionner l'image du bouton (AVIF)
              folder: 'user/data/flex-objects/gresilhette'
              preview_images: true
              accept:
                - .avif

            section_histoire_3:
              type: section
              title: "Mentions et Distribution"
              underline: true
            spectacle.texte_distribution:
              type: markdown
              label: "Dernier paragraphe (ex: Écriture, mise en scène...)"

        tab_occitan_extrait:
          type: tab
          title: "Occitan & Extrait"
          fields:
            titre_occitan:
              type: text
              label: Titre de la section Occitan
              default: "L'intégration de la langue occitane dans le spectacle"
            occitan_paragraphes:
              type: list
              label: Paragraphes de la section Occitane
              btn_add: Ajouter un paragraphe (Alterné)
              fields:
                .texte_fr:
                  type: textarea
                  label: Paragraphe en Français
                  rows: 3
                .texte_oc:
                  type: textarea
                  label: Paragraphe en Occitan (S'affichera en gras)
                  rows: 3
            traduction_signature:
              type: text
              label: Signature de la traduction
              placeholder: "Ex: L'Alan Roch"
            section_extrait_design:
              type: section
              title: "Extrait de la pièce"
              underline: true
            titre_extrait:
              type: text
              label: Titre de la section Extrait
              default: "Un extrait du texte..."
            bio_extrait:
              type: markdown
              label: Corps de l'extrait (Le dialogue)

        tab_versions:
          type: tab
          title: "Versions / Déclinaisons"
          fields:
            spectacle.versions:
              type: list
              label: "Déclinaisons techniques du spectacle"
              btnLabel: "Ajouter une version technique"
              fields:
                .nom_version:
                  type: text
                  label: "Nom de la version (ex: Théâtre d'ombres)"
                .slug_version:
                  type: text
                  label: "Slug technique (ex: theatre-d-ombres)"
                .image_version:
                  type: filepicker
                  label: "Image d'illustration interne (ex: montage-inspiration.avif)"
                  folder: 'user/data/flex-objects/gresilhette'
                  preview_images: true
                  accept:
                    - .avif
                .texte_version:
                  type: markdown
                  label: "Descriptif de cette forme"
                .pdf_technique:
                  type: filepicker
                  label: "Fiche technique (PDF)"
                  folder: 'user/data/flex-objects/gresilhette'
                  accept:
                    - .pdf
                .btn_technique:
                  type: filepicker
                  label: "Image du bouton de téléchargement (AVIF)"
                  folder: 'user/data/flex-objects/gresilhette'
                  accept:
                    - .avif