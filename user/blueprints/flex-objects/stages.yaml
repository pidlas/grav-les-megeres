type: flex-objects
title: Stages de théâtre
description: Gestion des médias et informations de la page Stages de théâtre

config:
  data:
    storage:
      className: 'Grav\Framework\Flex\Storage\FolderStorage'
      options:
        formatter:
          class: 'Grav\Framework\File\Formatter\YamlFormatter'
        folder: 'user/data/flex-objects/stages'
    media:
      per_object: false

  site:
    templates:
      object:
        route: /prestations/stages

  admin:
    router:
      path: /stages
    menu:
      list:
        route: /stages
        title: Page Stages
        priority: 7
        icon: fa fa-masks-theater
    list:
      title: Configuration de la page Stages
      fields:
        title:
          title: Titre de la page
          field: title
          link: edit

form:
  fields:
    tabs:
      type: tabs
      active: 1
      fields:

        tab_general:
          type: tab
          title: "Contenu de la page Stages"
          fields:
            title:
              type: text
              label: Titre de la page (S'affichera dans le H1)
              validate:
                required: true
            menu:
              type: text
              label: Titre dans le menu du site
            meta_description:
              type: textarea
              label: Meta Description (SEO)
              rows: 2

            section_photo_haut:
              type: section
              title: "1. Photo principale d'illustration"
              underline: true
            stages_photo_principale:
              type: filepicker
              label: "Photo d'illustration du stage (AVIF)"
              folder: 'user-data://flex-objects/stages'
              preview_images: true
              accept:
                - .avif
            stages_alt_photo:
              type: text
              label: "Texte alternatif de la photo (SEO / Accessibilité)"
              default: "Un stage de théâtre de la Compagnie Les Mégères de l'Humus"

            section_texte:
              type: section
              title: "2. Texte de présentation"
              underline: true
            stages_description:
              type: markdown
              label: "Paragraphes de présentation des stages"

            section_affiches:
              type: section
              title: "3. Affiches Tarifs et Objectifs (Recto / Verso)"
              underline: true
            stages_affiche_recto:
              type: filepicker
              label: "Affiche Recto : Tarifs des stages (AVIF)"
              folder: 'user-data://flex-objects/stages'
              preview_images: true
              accept:
                - .avif
            stages_affiche_verso:
              type: filepicker
              label: "Affiche Verso : Objectifs pédagogiques (AVIF)"
              folder: 'user-data://flex-objects/stages'
              preview_images: true
              accept:
                - .avif